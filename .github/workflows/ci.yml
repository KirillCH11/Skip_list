name: CI

on: [push, pull_request]

jobs:
  build-and-test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        cpp: [17, 20]
        compiler: [gcc, clang]
        exclude:
          - os: windows-latest
            compiler: clang
          - os: macos-latest
            compiler: gcc
    steps:
    - uses: actions/checkout@v2
    
    - name: Install dependencies
      run: |
        if [ "${{ runner.os }}" = "Ubuntu" ]; then
          sudo apt-get update
          sudo apt-get install -y build-essential cmake libgtest-dev
        elif [ "${{ runner.os }}" = "macOS" ]; then
          brew install cmake gtest
        fi
        
    - name: Configure
      run: |
        mkdir build
        cd build
        cmake .. -DCMAKE_CXX_STANDARD=${{ matrix.cpp }}
        
    - name: Build
      run: |
        cd build
        cmake --build .
        
    - name: Run tests
      run: |
        cd build
        ctest --output-on-failure
